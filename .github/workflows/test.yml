name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge:
    name: forge
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository and pinned submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.5.1
      - name: Check formatting
        run: forge fmt --check
      - name: Lint
        run: forge lint --deny warnings
      - name: Build
        run: forge build --sizes
      - name: Test
        run: forge test -vvv
